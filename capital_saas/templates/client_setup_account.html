{% extends "base.html" %}
{% block title %}保存报告到我的账号{% endblock %}
{% block content %}
<section class="client-auth-shell"><div class="client-auth-card">
  <p class="eyebrow">保存这份报告</p><h1>创建客户登录密码</h1>
  <p>设置后可长期查看历史报告、订单、资料和融资项目。</p>
  {% if error %}<div class="form-error is-visible">{{ error }}</div>{% endif %}
  <form method="post" action="/client/setup-account">
    <label>手机号<input value="{{ customer.login_phone or customer.phone }}" disabled></label>
    <label>姓名（选填）<input name="name" value="{{ customer.name or customer.contact_name }}" autocomplete="name"></label>
    <label>密码<input type="password" name="password" minlength="8" autocomplete="new-password" required placeholder="至少8位"></label>
    <label>确认密码<input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required placeholder="再次输入密码"></label>
    <button class="btn btn-primary client-auth-submit" type="submit">保存并进入我的报告</button>
  </form>
</div></section>
{% endblock %}
