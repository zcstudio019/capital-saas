{% extends "base.html" %}
{% block title %}找回客户账号密码{% endblock %}
{% block content %}
<section class="client-auth-shell"><div class="client-auth-card">
  <p class="eyebrow">账号安全</p><h1>忘记密码</h1>
  {% if submitted %}
    <div class="safe-note">如果该手机号已注册，我们将发送密码重置方式。</div>
    <a class="btn client-auth-submit" href="/client/login">返回登录</a>
  {% else %}
    <p>请输入测评时使用的手机号。</p>
    <form method="post" action="/client/forgot-password">
      <label>手机号<input name="phone" inputmode="tel" autocomplete="tel" required></label>
      <button class="btn btn-primary client-auth-submit" type="submit">获取重置方式</button>
    </form>
  {% endif %}
</div></section>
{% endblock %}
