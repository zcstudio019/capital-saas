{% extends "base.html" %}
{% block title %}重置客户账号密码{% endblock %}
{% block content %}
<section class="client-auth-shell"><div class="client-auth-card">
  <p class="eyebrow">账号安全</p><h1>设置新密码</h1>
  {% if error %}<div class="form-error is-visible">{{ error }}</div>{% endif %}
  <form method="post" action="/client/reset-password/{{ token }}">
    <label>新密码<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
    <label>确认新密码<input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></label>
    <button class="btn btn-primary client-auth-submit" type="submit">保存新密码</button>
  </form>
</div></section>
{% endblock %}
