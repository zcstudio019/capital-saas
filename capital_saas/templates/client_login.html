{% extends "base.html" %}
{% block title %}客户登录｜沪上银{% endblock %}
{% block content %}
<section class="client-auth-shell">
  <div class="client-auth-card">
    <p class="client-auth-brand">沪上银</p>
    <h1>客户登录</h1>
    <p>登录后可长期查看您的企业报告、订单、资料、顾问预约和融资项目。</p>
    {% if password_reset %}<div class="alert success">密码已重置，请使用新密码登录。</div>{% endif %}
    {% if error %}<div class="form-error is-visible">{{ error }}</div>{% endif %}
    <form method="post" action="/client/login" data-loading-form>
      <input type="hidden" name="next_url" value="{{ next_url }}">
      <label for="client-login-phone">手机号</label>
      <input id="client-login-phone" name="phone" value="{{ phone or '' }}" inputmode="tel"
             autocomplete="tel" required placeholder="请输入手机号">
      <label for="client-login-password">登录密码</label>
      <input id="client-login-password" type="password" name="password"
             autocomplete="current-password" required placeholder="请输入密码">
      <label class="remember-row" for="client-login-remember">
        <input id="client-login-remember" type="checkbox" name="remember_me" value="1">
        <span>记住我</span>
      </label>
      <button class="btn btn-primary client-auth-submit" type="submit">登录客户中心</button>
    </form>
    <a class="client-forgot-link" href="/client/forgot-password">忘记密码</a>
    <div class="client-auth-secondary">
      <p>还没有账号？ <a href="/client/register">立即注册</a></p>
      <p>已有历史报告但未设置密码？ <a href="/client/activate">找回原账号</a></p>
    </div>
    <a class="client-auth-home" href="/">返回首页</a>
  </div>
</section>
{% endblock %}
