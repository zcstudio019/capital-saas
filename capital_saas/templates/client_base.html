<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}企业融资服务中心{% endblock %}</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body class="client-body">
  <header class="client-header">
    <a href="/client/dashboard"><strong>沪上银</strong><span>企业融资服务中心</span></a>
    <nav aria-label="客户中心导航">
      <a href="/client/dashboard">首页</a><a href="/client/reports">我的报告</a><a href="/client/documents">我的资料</a>
      <a href="/client/orders">我的订单</a><a href="/client/advisor-bookings">顾问预约</a><a href="/client/projects">融资项目</a>
      <a href="/client/messages">通知</a><a href="/client/account">账号设置</a><a href="/client/logout">退出登录</a>
    </nav>
  </header>
  {% if request.session.get('token_login_notice') %}<div class="client-session-notice">您正在通过临时访问链接查看。为长期访问报告，建议使用手机号和密码登录。</div>{% endif %}
  <main class="client-main">{% block content %}{% endblock %}</main>
  <footer class="client-footer">本平台信息仅用于企业融资规划与服务协同，实际审批结果以金融机构为准。</footer>
</body></html>
