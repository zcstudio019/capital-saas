<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}企业融资服务中心{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css?v=20260811-client-navigation">
  {% block extra_head %}{% endblock %}
</head>
<body class="client-body">
  {% include "components/client_header.html" %}
  {% if request.session.get('token_login_notice') %}
    <div class="client-session-notice">您正在通过临时访问链接查看。为长期访问报告，建议使用手机号和密码登录。</div>
  {% endif %}
  <main class="client-main">{% block content %}{% endblock %}</main>
  <footer class="client-footer">本平台信息仅用于企业融资规划与服务协同，实际审批结果以金融机构为准。</footer>
  <script src="/static/js/main.js?v=20260811-client-navigation"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
