{% extends "base.html" %}
{% block title %}设置客户登录密码｜沪上银{% endblock %}
{% block content %}
<section class="client-auth-shell">
  <div class="client-auth-card">
    <p class="client-auth-brand">沪上银</p><h1>设置登录密码</h1>
    <p>账号手机号：{{ phone }}。密码设置成功后，将自动进入“我的报告”。</p>
    {% if error %}<div class="form-error is-visible">{{ error }}</div>{% endif %}
    <form method="post" action="/client/activate/{{ token }}" data-loading-form>
      <label for="activation-password">登录密码</label><input id="activation-password" type="password" name="password" minlength="8" autocomplete="new-password" required placeholder="至少8位">
      <label for="activation-confirm-password">确认密码</label><input id="activation-confirm-password" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required placeholder="请再次输入密码">
      <button class="btn btn-primary client-auth-submit" type="submit">激活并进入我的报告</button>
    </form>
  </div>
</section>
{% endblock %}
